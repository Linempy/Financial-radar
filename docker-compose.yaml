version: '3.8'

services:
  master_postgres:
    image: postgres:13.3
    container_name: hackathon_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  master_redis:
    image: redis/redis-stack:latest
    container_name: hackathon_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:5.4.0
    container_name: hackathon_zookeeper
    ports:
      - "${ZOOKEEPER_PORT:-2181}:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_CLIENT_PORT:-2181}

  broker:
    image: confluentinc/cp-server:5.4.0
    container_name: hackathon_broker
    depends_on:
      - zookeeper
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  schema-registry:
    image: confluentinc/cp-schema-registry:5.4.0
    container_name: hackathon_schema_registry
    depends_on:
      - broker
    ports:
      - "${SCHEMA_REGISTRY_PORT:-8087}:8081"
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://broker:9092

  loki:
    image: grafana/loki:2.9.1
    container_name: hackathon_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  grafana:
    image: grafana/grafana:latest
    container_name: hackathon_grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin

  # ВАШИ СЕРВИСЫ с новой структурой
  admin-panel:
    build:
      context: ./docker/admin
      dockerfile: Dockerfile
    container_name: admin_panel
    ports:
      - "8080:8080"
    depends_on:
      - master_postgres
      - master_redis
    environment:
      SPRING_PROFILES_ACTIVE: docker

  rule-engine:
    build:
      context: ./docker/ruleEngine
      dockerfile: Dockerfile
    container_name: rule_engine
    ports:
      - "8082:8082"
    depends_on:
      master_postgres:
        condition: service_healthy
      master_redis:
        condition: service_healthy
      broker:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker

  transactional-service:
    build:
      context: ./docker/transactionalService
      dockerfile: Dockerfile
    container_name: transactional_service
    ports:
      - "8081:8081"
    depends_on:
      - master_postgres
      - master_redis
      - broker
    environment:
      SPRING_PROFILES_ACTIVE: docker

  notification-service:
    build:
      context: ./docker/notification
      dockerfile: Dockerfile
    container_name: notification_service
    ports:
      - "8083:8083"
    depends_on:
      - broker
    environment:
      SPRING_PROFILES_ACTIVE: docker

volumes:
  postgres_data:
  redis_data:
  grafana_data:

networks:
  default:
    driver: bridge