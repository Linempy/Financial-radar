spring:
  mail:
    host: smtp.mail.ru
    port: 465
    username: Kir32kir@mail.ru
    password: YtVxbHxoLuMYUtKIezjz
    protocol: smtps
    from: Kir32kir@mail.ru
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
            trust: smtp.mail.ru
          starttls:
            enable: false

  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://master_postgres:5432/postgres  # ИЗМЕНИТЬ
    username: user
    password: password

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master-rule-engine.yaml

  data:
    redis:
      port: 6379
      host: master_redis  # ИЗМЕНИТЬ
      channels:
        calculations_channel:
          name: calculations_channel
      schema:
        rule:
          ttl-days: 1
        idempotency-key:
          ttl-min: 5

  kafka:
    bootstrap-servers: broker:9092  # ИЗМЕНИТЬ
    topics:
      transactions:
        check:
          name: check_transaction
          partitions: 1
          replicas: 1
      rules:
        reload:
          name: rules_reload
          partitions: 1
          replicas: 1
      notification:
        name: send_notification
        partition-count: 1
        replica-count: 1
    consumer:
      enable-auto-commit: true
      group-id: transactional-service-group
      keyDeserializer: "org.apache.kafka.common.serialization.StringDeserializer"
      valueDeserializer: "io.confluent.kafka.serializers.KafkaAvroDeserializer"
      autoOffsetReset: "earliest"
      properties:
        schema:
          registry:
            url: "http://schema-registry:8081"  # ИЗМЕНИТЬ
        specific:
          avro:
            reader: "true"
    producer:
      keySerializer: "org.apache.kafka.common.serialization.StringSerializer"
      valueSerializer: "io.confluent.kafka.serializers.KafkaAvroSerializer"
      properties:
        schema:
          registry:
            url: "http://schema-registry:8081"  # ИЗМЕНИТЬ

server:
  port: 8082

logging:
  config: classpath:logback-docker.xml  # ДОБАВИТЬ
  level:
    root: info

risk:
  threshold: 2

scheduling:
  redis:
    rules:
      reload: 0 */30 * * * *

retry:
  config:
    max-attempts: 3
    initial-interval-ms: 1000
    multiplier: 2.0
    delay: 1000
    max-interval-ms: 10_000

thread-pool:
  async:
    rule:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 1000
    commit:
      core-pool-size: 5
      max-pool-size: 10
      queue-capacity: 1000